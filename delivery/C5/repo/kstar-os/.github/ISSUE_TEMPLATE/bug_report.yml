name: Bug report
description: 报告一个可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认：`python3 -m unittest discover -s tests -v` 是否通过。
        如果不通过，请附上失败用例名。
  - type: input
    id: version
    attributes:
      label: 版本 / commit
      placeholder: "0.3.0 或 commit hash"
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python 版本
      options: ["3.9", "3.10", "3.11", "3.12", "3.13+"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 具体命令，不要写"打开程序然后报错"
      placeholder: |
        1. python3 scripts/kstar.py skill-use typo-name ...
        2. 观察 L3_skills/ 下是否出现新目录
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 完整报错 / 输出
      render: shell
