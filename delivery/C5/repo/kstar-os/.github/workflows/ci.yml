name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test (status)
        run: python scripts/kstar.py status
      - name: Smoke test (export)
        run: python scripts/kstar.py export-html --out /tmp/dash.html
      - name: Check no third-party imports
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          stdlib = set(sys.stdlib_module_names)
          bad = []
          for p in pathlib.Path("scripts").glob("*.py"):
              tree = ast.parse(p.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          top = a.name.split(".")[0]
                          if top not in stdlib:
                              bad.append(f"{p}: import {top}")
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      top = node.module.split(".")[0]
                      if top not in stdlib:
                          bad.append(f"{p}: from {top}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("no third-party imports")
          PY
